# v1.0.1 처럼 "v"로 시작하는 태그를 올리면 Windows 설치 파일을 만들어 Releases(다운로드 페이지)에 올려요.
# Actions 탭에서 "Run workflow"를 눌러 직접 돌릴 수도 있어요.
name: 설치 파일 만들기

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 태그 번호를 앱 버전으로 맞추기
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - run: npm ci

      - name: 설치 파일 만들고 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: >
          npx electron-builder --win --publish always
          -c.publish.provider=github
          -c.publish.owner=${{ github.repository_owner }}
          -c.publish.repo=${{ github.event.repository.name }}
          -c.publish.releaseType=release

  # 안드로이드 설치 파일(uri-iljeong.apk)을 만들어 같은 릴리스에 붙여요.
  # 처음 한 번 README의 "안드로이드 서명 키" 단계(Secrets 4개)를 해 두어야 해요.
  android:
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: 버전 정하기
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then V="${GITHUB_REF_NAME#v}"; else V=$(node -p "require('./package.json').version"); fi
          IFS=. read -r MA MI PA <<< "${V%%-*}"
          echo "name=$V" >> "$GITHUB_OUTPUT"
          echo "code=$(( ${MA:-1} * 10000 + ${MI:-0} * 100 + ${PA:-0} ))" >> "$GITHUB_OUTPUT"

      - run: npm ci

      - run: npx cap sync android

      - name: 서명 키 꺼내기
        shell: bash
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KS" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 시크릿이 없어요. README의 '안드로이드 서명 키' 단계를 먼저 해 주세요."
            exit 1
          fi
          echo "$KS" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: APK 만들기
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.ver.outputs.name }}
          VERSION_CODE: ${{ steps.ver.outputs.code }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk ../uri-iljeong.apk

      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          T="v${{ steps.ver.outputs.name }}"
          gh release view "$T" >/dev/null 2>&1 || gh release create "$T" --title "$T" --notes "" || true
          gh release upload "$T" uri-iljeong.apk --clobber
